[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults in signatures are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"src/reporting/pdf_builder.py" = ["N802", "N803", "N806"]  # ReportLab hook names; short style dict
